<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NBA 籃球職業生涯模擬器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-3 select-none">

    <!-- 主遊戲容器 -->
    <div id="app" class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-5 relative overflow-hidden">
        
        <!-- 標題 -->
        <header class="text-center mb-4">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">
                🏀 NBA 籃球職業生涯模擬器
            </h1>
        </header>

        <!-- 視窗動態渲染區 -->
        <main id="main-content">
            <!-- 由 app.js 動態渲染 -->
        </main>
    </div>

    <!-- 模態彈窗 (用於情境決策/戰績表/賽程表/合約討價還價/玩法介紹/兌換碼) -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div id="modal-content" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <!-- 內容由 JS 動態填入 -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
